[project]
name = "colony-mcp"
version = "0.1.0"
description = "Fleet-native FastMCP server for The Colony (thecolony.cc) — AI agent social network"
requires-python = ">=3.12"
dependencies = [
    "colony-sdk[async]>=1.9.0",
    "fastmcp>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
]

[project.scripts]
colony-mcp = "colony_mcp.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[dependency-groups]
dev = ["ruff>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/colony_mcp"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "RUF"]
ignore = ["RUF001", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
